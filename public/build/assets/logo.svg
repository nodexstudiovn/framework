<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
    <defs>
        <linearGradient id="nxGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="50%" stop-color="#06B6D4" />
            <stop offset="100%" stop-color="#3B82F6" />
        </linearGradient>
        <linearGradient id="nxGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#27272A" />
            <stop offset="100%" stop-color="#09090B" />
        </linearGradient>
        <filter id="nxGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#nxGradDark)" stroke="#3F3F46" stroke-width="1.5" />
    
    <!-- Letter 'N' Path -->
    <path d="M15 33V15L33 33V15" stroke="url(#nxGradPrimary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter 'X' Cross Path (Crossing through the diagonal of N) -->
    <path d="M33 15L26.5 21.5M21.5 26.5L15 33" stroke="#F4F4F5" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Node Connection Points -->
    <circle cx="24" cy="24" r="3" fill="#10B981" filter="url(#nxGlow)" />
    <circle cx="15" cy="15" r="2" fill="#E4E4E7" />
    <circle cx="33" cy="33" r="2" fill="#E4E4E7" />
    <circle cx="33" cy="15" r="2" fill="#10B981" />
    <circle cx="15" cy="33" r="2" fill="#3B82F6" />
</svg>
